<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login - TopPay</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="stylesheet" href="../css/admin.css" />
  </head>
  <body>
    <div class="admin-login-wrapper">
      <div class="admin-login-box">
        <div style="text-align: center; margin-bottom: 24px;">
          <img src="/toppay-logo.svg" alt="TopPay logo" style="display:block;width:180px;height:86px;object-fit:contain;margin:0 auto;filter:drop-shadow(0 8px 18px rgba(0,0,0,.16));" />
        </div>
        <div class="admin-title">Admin Portal</div>
        <form id="adminLoginForm">
          <input
            type="email"
            id="email"
            class="admin-input"
            placeholder="admin@toppay.com"
            required
          />
          <input
            type="password"
            id="password"
            class="admin-input"
            placeholder="Password"
            required
          />
          <div id="errorMsg" class="hidden" style="color: #ef4444; text-align: center; margin-bottom: 16px; font-size: 14px;"></div>
          <button type="submit" class="admin-btn">Login</button>
        </form>
      </div>
    </div>

    <script type="module" src="../../user-app/js/config/supabase.js"></script>
    <script type="module" src="../js/login.js"></script>
  </body>
</html>
