<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>You are offline — TopPay</title>
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#1f2d7a" />
    <link rel="icon" type="image/svg+xml" href="/toppay-logo.svg" />
    <style>
      :root { font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f6f8fc; color: #334155; padding: 24px; }
      .card { max-width: 420px; text-align: center; background: #fff; border: 1px solid #e5e7eb; border-radius: 16px; padding: 32px 24px; }
      h1 { margin: 0 0 8px; font-size: 20px; color: #111827; letter-spacing: -.02em; }
      p { margin: 0 0 20px; line-height: 1.7; font-size: 15px; }
      a { display: inline-block; background: #1f2d7a; color: #fff; text-decoration: none; padding: 11px 22px; border-radius: 10px; font-weight: 600; font-size: 15px; }
      img { width: 48px; height: 48px; margin-bottom: 12px; }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/toppay-logo.svg" alt="TopPay" />
      <h1>You are offline</h1>
      <p>Your device has lost its internet connection. Check your network and try again.</p>
      <a href="/">Retry</a>
    </div>
  </body>
</html>
